[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vmamba"
version = "2.0.0"
description = "VMamba as a standalone Hugging Face custom pipeline (no official transformers PR)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "VMamba authors" },
]
keywords = ["vmamba", "mamba", "transformers", "vision", "state-space"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.40.0",
    "pillow",
    "numpy",
    "torchvision",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/MzeroMiko/VMamba"
Paper = "https://arxiv.org/abs/2401.10166"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vmamba"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
